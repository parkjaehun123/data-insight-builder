<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Analytics Bar Chart -->
  <!-- Bar 1 (Left) -->
  <rect x="110" y="270" width="60" height="132" rx="14" fill="url(#bar1Grad)" filter="url(#shadow)"/>
  <!-- Bar 2 (Middle, Tallest) -->
  <rect x="226" y="170" width="60" height="232" rx="14" fill="url(#bar2Grad)" filter="url(#shadow)"/>
  <!-- Bar 3 (Right) -->
  <rect x="342" y="230" width="60" height="172" rx="14" fill="url(#bar3Grad)" filter="url(#shadow)"/>

  <!-- Upward Trend Line / Sparkline with Glow -->
  <polyline points="140,260 256,160 372,210 424,120" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Trend End Circle Point -->
  <circle cx="424" cy="120" r="16" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="424" cy="120" r="8" fill="#2563eb"/>

  <!-- AI Sparkle Icon -->
  <path d="M 390,55 Q 390,75 410,75 Q 390,75 390,95 Q 390,75 370,75 Q 390,75 390,55 Z" fill="#fef08a"/>
</svg>